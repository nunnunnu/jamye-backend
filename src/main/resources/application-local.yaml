spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/jamye}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
cloud:
  aws:
    s3:
      bucket: ${AWS_S3_BUCKET:jamye-image-local}
discord:
  redirect: ${DISCORD_REDIRECT:http://localhost:8081/oauth/redirect}
image:
  url: ${IMAGE_URL:http://jamye-image-local.s3-website.ap-northeast-2.amazonaws.com}
kakao:
  redirect: ${KAKAO_REDIRECT:http://localhost:8081/oauth/kakao}
front:
  url: ${FRONT_URL:http://localhost:8081}
