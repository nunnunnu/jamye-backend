spring:
  jpa:
    database: mysql
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  servlet:
    multipart:
      max-file-size: 10000MB
      max-request-size: 20000MB
      enabled: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
      auth-code-expiration-millis: 1800000
jwt:
  secretKey: ${JWT_SECRET_KEY}
discord:
  clientId: ${DISCORD_CLIENT_ID}
  secretKey: ${DISCORD_SECRET_KEY}
  bot_token_key: ${BOT_TOKEN}
  redirect: ${DISCORD_REDIRECT:https://jamye.p-e.kr/oauth/redirect}
kakao:
  clientId: ${KAKAO_CLIENT_ID}
  redirect: ${KAKAO_REDIRECT:https://jamye.p-e.kr/oauth/kakao}
logging:
  level:
    org:
      hibernate:
        orm:
          jdbc:
            bind: trace
    root: info
google:
  client-id: ${GOOGLE_CLIENT_ID}

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}
    s3:
      bucket: ${AWS_S3_BUCKET:jamye-image}
    region:
      static: ${AWS_REGION:ap-northeast-2}
      auto: false
    stack:
      auto: false
fire_base:
  file: ${FIREBASE_CREDENTIALS_PATH:${FIRE_BASE:}}
  fire_base_id: ${FIREBASE_PROJECT_ID:${FIRE_BASE_ID:}}
image:
  url: ${IMAGE_URL:https://d23eha8a4ssn72.cloudfront.net}
front:
  url: ${FRONT_URL:https://jamye.p-e.kr}
sentry:
  dsn: ${SENTRY_DSN:}
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:1.0}
  max-request-body-size: always
  logging:
    minimum-event-level: info
    minimum-breadcrumb-level: info
app:
  cors:
    # 쉼표로 구분. 끝 슬래시는 무시된다. file:// 과 https://localhost 는 Cordova.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://jamye.p-e.kr,file://,file://*,https://localhost,http://localhost:8080,http://localhost:8081,http://jamye-frontend.s3-website.ap-northeast-2.amazonaws.com,https://d39kn92x79hg54.cloudfront.net}
