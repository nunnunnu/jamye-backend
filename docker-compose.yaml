# Local development only. Production is docker-compose.prod.yml.
# Ports are bound to 127.0.0.1. Fill .env from .env.example first.

services:
  mysql:
    image: mysql:8.0
    container_name: mysql-container
    environment:
      MYSQL_ROOT_HOST: "%"
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-jamye}
      MYSQL_USER: ${MYSQL_USER:-jamye}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
  redis:
    image: redis:7-alpine
    container_name: redis_test
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    volumes:
      - redis-data:/data
  spring-boot-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: jamye-backend-app
    container_name: spring-boot-container
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - mysql
      - redis
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-jamye}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul"
      DB_USERNAME: ${MYSQL_USER:-jamye}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      MAIL_USERNAME: ${MAIL_USERNAME:?set MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?set MAIL_PASSWORD}
      BOT_TOKEN: ${BOT_TOKEN:?set BOT_TOKEN}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?set DISCORD_CLIENT_ID}
      DISCORD_SECRET_KEY: ${DISCORD_SECRET_KEY:?set DISCORD_SECRET_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:?set KAKAO_CLIENT_ID}
      FIREBASE_CREDENTIALS_PATH: /app/secrets/firebase.json
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?set FIREBASE_PROJECT_ID}
      GOOGLE_APPLICATION_CREDENTIALS: /app/secrets/google-vision.json
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      - ${FIREBASE_CREDENTIALS_FILE:?set FIREBASE_CREDENTIALS_FILE}:/app/secrets/firebase.json:ro
      - ${GOOGLE_CREDENTIALS_FILE:?set GOOGLE_CREDENTIALS_FILE}:/app/secrets/google-vision.json:ro
volumes:
  mysql_data:
  redis-data:
