name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Compile jar
        run: ./gradlew bootJar -x test --no-daemon

  # Optional. Register a self-hosted runner on the Oracle ARM VM first.
  # The job does not use actions/checkout, because checkout --clean would delete .env and secrets/.
  # See docs/DEPLOY.md.
  deploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    needs: build
    steps:
      - name: Deploy on the Oracle VM
        run: |
          cd /opt/jamye
          git pull --ff-only origin main
          docker compose -f docker-compose.prod.yml up -d --build
